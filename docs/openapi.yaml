components:
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
    platform-jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Platform-admin token from POST /platform/auth/login - a separate credential space from tenant users, never interchangeable with the "jwt" scheme above.
    device-key:
      type: apiKey
      in: header
      name: X-Device-Key-Id
      description: The prefix half of the issued API key (before the ".") - the secret half is never sent, see X-Signature.
  schemas:
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - refreshToken
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: operator1@beta.test
        password:
          type: string
          minLength: 8
          example: OperatorPass123
        fullName:
          type: string
          example: Suda Operator
        role:
          type: string
          enum:
            - admin
            - operator
            - viewer
            - manager
            - warehouse_staff
            - purchasing_staff
          example: operator
      required:
        - email
        - password
        - fullName
    UpdateUserDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - admin
            - operator
            - viewer
            - manager
            - warehouse_staff
            - purchasing_staff
          example: operator
        isActive:
          type: boolean
          example: true
    UpdateProductDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: INTL-00123
        slug:
          type: string
          maxLength: 150
          example: cardboard-box-30x30x30
        name:
          type: string
          maxLength: 255
          example: Cardboard Box 30x30x30
        description:
          type: string
          maxLength: 1000
          example: Standard shipping carton, single-wall corrugated.
        categoryId:
          type: string
          format: uuid
          description: id from GET /categories
        unitOfMeasure:
          type: string
          maxLength: 20
          example: pcs
        isActive:
          type: boolean
          example: true
        isReturnable:
          type: boolean
          example: true
        unitId:
          type: string
          format: uuid
          description: id from GET /units?type=quantity
        brandId:
          type: string
          format: uuid
          description: id from GET /brands
        manufacturerId:
          type: string
          format: uuid
          description: id from GET /manufacturers
        widthValue:
          type: number
          example: 30
        lengthValue:
          type: number
          example: 30
        heightValue:
          type: number
          example: 30
        dimensionUnitId:
          type: string
          format: uuid
          description: id from GET /units?type=dimension
        weightValue:
          type: number
          example: 1.2
        weightUnitId:
          type: string
          format: uuid
          description: id from GET /units?type=weight
        supplierId:
          type: string
          format: uuid
          description: id from GET /suppliers
        costPriceMinor:
          type: number
          minimum: 0
          example: 15000
          description: Minor units (satang)
        sellingPriceMinor:
          type: number
          minimum: 0
          example: 25000
          description: Minor units (satang)
        currency:
          type: string
          maxLength: 3
          example: THB
        reorderPoint:
          type: number
          minimum: 0
          example: 10
          description: Flag this product as low-stock once inStockCount drops to or below this.
        minReorderQuantity:
          type: number
          minimum: 0
          example: 20
          description: Suggested quantity to reorder once low-stock triggers. Fixed value, not auto-calculated.
        barcodeValue:
          type: string
          maxLength: 64
          example: '1234567890123'
        barcodeSymbologyId:
          type: string
          format: uuid
          description: id from GET /barcode-symbologies
        taxTypeId:
          type: string
          format: uuid
          description: id from GET /tax-types
        discountType:
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
        discountValue:
          type: number
          minimum: 0
          example: 10
          description: 0-100 when discountType=percentage, minor units when discountType=fixed.
        lotControlled:
          type: boolean
          example: true
        warrantyPeriodDays:
          type: number
          minimum: 0
          example: 365
          description: Warranty period in days.
    ReorderProductImagesDto:
      type: object
      properties:
        imageIds:
          minItems: 1
          description: Every image id belonging to this product, exactly once, in the desired order - first entry becomes primary.
          type: array
          items:
            type: string
            format: uuid
      required:
        - imageIds
    CreateUnitDto:
      type: object
      properties:
