openapi: 3.0.0
info:
  title: MatchStock API Contract
  description: |-
    RFID inventory ingestion + management API. Every route below is shown at its real /api/v1/... path. Most endpoints require a user JWT (sign in via POST /api/v1/auth/login, then click "Authorize" below and paste the accessToken). POST /api/v1/ingestion/readings is authenticated differently: each request is signed with the device secret rather than carrying a bearer token - see that endpoint's description for the X-Device-Key-Id/X-Signature headers.

    Response envelope: every successful response is wrapped as `{ "success": true, "data": <shown below>, "message": string, "meta"?: {page,limit,totalCount,totalPages} }` (`meta` only on paginated list endpoints) - the schemas documented per endpoint below describe the `data` field only, not the outer envelope. Every error response is `{ "success": false, "message": string, "errors": string[] }` - `message` is a fixed category label (e.g. "Validation failed", "Not found"), the actual reason(s) are always in `errors` (the real HTTP status code is on the response line, not duplicated in the body). A handful of non-JSON endpoints (file downloads, the RFID ingestion endpoint, the payment webhook) are exempt and return their body unwrapped - each says so in its own description.
  version: '1.0'
servers:
  - url: https://match-stock.ddns.net/api/v1
    description: Production (OCI VM)
  - url: http://localhost:3010/api/v1
    description: Local Development Server
security:
  - jwt: []
paths:
  /auth/login:
    post:
      operationId: AuthController_login_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example:
                email: owner@acme-demo.test
                password: Passw0rd!
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                example:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiIuLi4ifQ.abc123
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIuLi4ifQ.def456
                  user:
                    id: 9c6b1a2d-3e4f-4a5b-8c7d-1e2f3a4b5c6d
                    email: owner@acme-demo.test
                    role: owner
                    tenantId: e5e91151-2499-4a6a-be28-3433f4afdba0
                  subscription:
                    planCode: GROWTH
                    status: active
                    features:
                      - products.manage
                      - warehouses.manage
                      - reports.view
      summary: Sign in with email/password, get a JWT access + refresh token pair.
      tags:
        - Auth
  /auth/me:
    get:
      operationId: AuthController_me_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                example:
                  success: true
                  data:
                    id: 9c6b1a2d-3e4f-4a5b-8c7d-1e2f3a4b5c6d
                    email: owner@acme-demo.test
                    fullName: Owner Demo
                    role: owner
                    tenantId: d01b933f-1a06-411a-9009-516a2a52c749
                    isActive: true
                    lastLoginAt: '2026-08-18T02:39:41.574Z'
                    subscription:
                      planCode: GROWTH
                      status: active
                      features:
                        - products.manage
                        - warehouses.manage
                        - reports.view
                  message: Operation completed successfully
      security:
        - jwt: []
      summary: Get the signed-in user's own profile.
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: AuthController_refresh_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: Exchange a still-valid refresh token for a new access + refresh token pair.
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: AuthController_logout_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
