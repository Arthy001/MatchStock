info:
  title: MatchStock API
  description: |-
    RFID inventory ingestion + management API. Every route below is shown at its real /api/v1/... path. Most endpoints require a user JWT (sign in via POST /api/v1/auth/login, then click "Authorize" below and paste the accessToken). POST /api/v1/ingestion/readings is authenticated differently: each request is signed with the device secret rather than carrying a bearer token - see that endpoint's description for the X-Device-Key-Id/X-Signature headers.

    Response envelope: every successful response is wrapped as `{ "success": true, "data": <shown below>, "message": string, "meta"?: {page,limit,totalCount,totalPages} }` (`meta` only on paginated list endpoints) - the schemas documented per endpoint below describe the `data` field only, not the outer envelope. Every error response is `{ "success": false, "message": string, "errors": string[] }` - `message` is a fixed category label (e.g. "Validation failed", "Not found"), the actual reason(s) are always in `errors` (the real HTTP status code is on the response line, not duplicated in the body). A handful of non-JSON endpoints (file downloads, the RFID ingestion endpoint, the payment webhook) are exempt and return their body unwrapped - each says so in its own description.
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: https://match-stock.ddns.net/api/v1
    description: Production (OCI VM)
  - url: http://localhost:3010/api/v1
    description: Local Development Server
components:
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
    platform-jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Platform-admin token from POST /platform/auth/login - a separate credential space from tenant users, never interchangeable with the "jwt" scheme above.
    device-key:
      type: apiKey
      in: header
      name: X-Device-Key-Id
      description: The prefix half of the issued API key (before the ".") - the secret half is never sent, see X-Signature.
  schemas:
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - refreshToken
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: operator1@beta.test
        password:
          type: string
          minLength: 8
          example: OperatorPass123
        fullName:
          type: string
          example: Suda Operator
        role:
          type: string
          enum:
            - admin
            - operator
            - viewer
            - manager
            - warehouse_staff
            - purchasing_staff
          example: operator
        companyId:
          type: string
          format: uuid
          description: Restrict this user to one Company (branch/subsidiary) - omit/null to see every company in the tenant.
      required:
        - email
        - password
        - fullName
    UpdateUserDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - admin
            - operator
            - viewer
            - manager
            - warehouse_staff
            - purchasing_staff
          example: operator
        isActive:
          type: boolean
          example: true
        companyId:
          type: string
          nullable: true
          format: uuid
          description: Restrict this user to one Company (branch/subsidiary) - null clears the restriction (sees every company in the tenant).
    UpdateProductDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: INTL-00123
        slug:
          type: string
          maxLength: 150
          example: cardboard-box-30x30x30
        name:
          type: string
          maxLength: 255
          example: Cardboard Box 30x30x30
        description:
          type: string
          maxLength: 1000
          example: Standard shipping carton, single-wall corrugated.
        categoryId:
          type: string
          format: uuid
          description: id from GET /categories
        unitOfMeasure:
          type: string
          maxLength: 20
          example: pcs
        isActive:
          type: boolean
          example: true
        isReturnable:
          type: boolean
          example: true
        unitId:
          type: string
          format: uuid
          description: id from GET /units?type=quantity
        brandId:
          type: string
          format: uuid
          description: id from GET /brands
        manufacturerId:
          type: string
          format: uuid
          description: id from GET /manufacturers
        widthValue:
          type: number
          example: 30
        lengthValue:
          type: number
          example: 30
        heightValue:
          type: number
          example: 30
        dimensionUnitId:
          type: string
          format: uuid
          description: id from GET /units?type=dimension
        weightValue:
          type: number
          example: 1.2
        weightUnitId:
          type: string
          format: uuid
          description: id from GET /units?type=weight
        supplierId:
          type: string
          format: uuid
          description: id from GET /suppliers
        costPriceMinor:
          type: number
          minimum: 0
          example: 15000
          description: Minor units (satang)
        sellingPriceMinor:
          type: number
          minimum: 0
          example: 25000
          description: Minor units (satang)
        currency:
          type: string
          maxLength: 3
          example: THB
        reorderPoint:
          type: number
          minimum: 0
          example: 10
          description: Flag this product as low-stock once inStockCount drops to or below this.
        minReorderQuantity:
          type: number
          minimum: 0
          example: 20
          description: Suggested quantity to reorder once low-stock triggers. Fixed value, not auto-calculated.
        barcodeValue:
          type: string
          maxLength: 64
          example: '1234567890123'
        barcodeSymbologyId:
          type: string
          format: uuid
          description: id from GET /barcode-symbologies
        taxTypeId:
          type: string
          format: uuid
          description: id from GET /tax-types
        discountType:
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
        discountValue:
          type: number
          minimum: 0
          example: 10
          description: 0-100 when discountType=percentage, minor units when discountType=fixed.
        lotControlled:
          type: boolean
          example: true
        warrantyPeriodDays:
          type: number
          minimum: 0
          example: 365
          description: Warranty period in days.
    ReorderProductImagesDto:
      type: object
      properties:
        imageIds:
          minItems: 1
          description: Every image id belonging to this product, exactly once, in the desired order - first entry becomes primary.
          type: array
          items:
            type: string
            format: uuid
      required:
        - imageIds
    CreateUnitDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: kg
          description: Auto-derived from name if omitted.
        name:
          type: string
          maxLength: 100
          example: Kilogram
        type:
          enum:
            - quantity
            - dimension
            - weight
          type: string
          example: quantity
          default: quantity
      required:
        - name
    UpdateUnitDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          example: false
    CreateBrandDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: acme
          description: Auto-derived from name if omitted.
        name:
          type: string
          maxLength: 100
          example: Acme
        description:
          type: string
          maxLength: 1000
      required:
        - name
    UpdateBrandDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          example: false
    CreateManufacturerDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: chainway
          description: Auto-derived from name if omitted.
        name:
          type: string
          maxLength: 255
          example: Chainway
        contactPerson:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 100
          format: email
      required:
        - name
    UpdateManufacturerDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        contactPerson:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 100
          format: email
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          example: false
    CreateSupplierDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: globex
          description: Auto-derived from name if omitted.
        name:
          type: string
          maxLength: 255
          example: Globex Supplies Co.
        contactPerson:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 50
        companyId:
          type: string
          format: uuid
          description: Set only if this supplier is really an inter-company subsidiary in the same tenant, not an outside vendor.
      required:
        - name
    UpdateSupplierDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        contactPerson:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 50
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          example: false
        companyId:
          type: string
          nullable: true
          format: uuid
          description: Set only if this supplier is really an inter-company subsidiary in the same tenant, not an outside vendor. null clears it back to an outside vendor.
    CreateCategoryDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: packaging
          description: Auto-derived from name if omitted.
        name:
          type: string
          maxLength: 255
          example: Packaging
        description:
          type: string
          maxLength: 1000
      required:
        - name
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          example: false
    CreateTaxTypeDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: VAT
        ratePercent:
          type: number
          minimum: 0
          maximum: 100
          example: 7
      required:
        - name
        - ratePercent
    UpdateTaxTypeDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: VAT
        ratePercent:
          type: number
          minimum: 0
          maximum: 100
          example: 7
        isActive:
          type: boolean
          example: true
        isDeleted:
          type: boolean
          example: false
    CreateBarcodeSymbologyDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: ean13
          description: Auto-derived from name if omitted.
        name:
          type: string
          maxLength: 100
          example: EAN-13
        description:
          type: string
          maxLength: 1000
      required:
        - name
    UpdateBarcodeSymbologyDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          example: false
    UpdateWarehouseDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Bangkok Main Warehouse
        address:
          type: string
          maxLength: 500
          example: 123 Sukhumvit Rd, Bangkok
        isActive:
          type: boolean
          example: true
        isDeleted:
          type: boolean
          example: false
        maxCapacity:
          type: number
          minimum: 0
          example: 1000
          description: Total tag-count ceiling - GET /alerts flags this warehouse once the live count exceeds it.
        companyId:
          type: string
          nullable: true
          format: uuid
          description: Scope this warehouse to one Company (branch/subsidiary) - null = shared/tenant-wide warehouse.
    UpdateBinLocationDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          example: A1-03
        zoneName:
          type: string
          maxLength: 100
          example: Zone A
        rack:
          type: string
          maxLength: 50
          example: Rack A01
        shelf:
          type: string
          maxLength: 50
          example: Level A
        capacityKg:
          type: number
          example: 500
        status:
          type: string
          example: available
        isActive:
          type: boolean
          example: true
        isDeleted:
          type: boolean
          example: false
        maxCapacity:
          type: number
          minimum: 0
          example: 100
          description: Total tag-count ceiling - GET /alerts flags this bin once the live count exceeds it.
    UpdateBlueprintDto:
      type: object
      properties:
        blueprintUrl:
          type: string
          format: uri
          example: https://storage.matchstock.com/blueprints/wh-001-layout.jpg
          description: Public or CDN URL of the CAD/2D blueprint image.
        opacity:
          type: number
          minimum: 0
          maximum: 1
          example: 0.55
        dimensions:
          type: object
          properties:
            widthMeters:
              type: number
              example: 42.0
            depthMeters:
              type: number
              example: 32.0
        zonesConfig:
          type: object
          description: Independent zone configurations for 3D layout
          example:
            ZoneA:
              name: Zone A
              color: '#3B82F6'
              racksCount: 4
            ZoneB:
              name: Zone B
              color: '#10B981'
              racksCount: 2
        walls:
          type: array
          description: 3D boundary walls definitions
          items:
            type: object
            properties:
              id:
                type: string
                example: wall-01
              startX:
                type: number
                example: 0
              startZ:
                type: number
                example: 0
              endX:
                type: number
                example: 42
              endZ:
                type: number
                example: 0
              heightMeters:
                type: number
                example: 6.0
              thicknessMeters:
                type: number
                example: 0.2
        doors:
          type: array
          description: 3D entrance and dock door definitions
          items:
            type: object
            properties:
              id:
                type: string
                example: door-01
              x:
                type: number
                example: 21
              z:
                type: number
                example: 0
              widthMeters:
                type: number
                example: 4.0
              heightMeters:
                type: number
                example: 4.5
              type:
                type: string
                enum: [dock, entrance, emergency_exit]
                example: dock
      required:
        - blueprintUrl
    BatchSaveBinItemDto:
      type: object
      properties:
        binCode:
          type: string
          example: ZoneA-A01-A-01
        zone:
          type: string
          example: Zone A
        rack:
          type: string
          example: Rack A01
        shelf:
          type: string
          example: Level A
        capacityKg:
          type: number
          example: 500
        maxCapacity:
          type: number
          example: 500
        status:
          type: string
          enum: [available, full, maintenance]
          example: available
        isActive:
          type: boolean
          example: true
      required:
        - binCode
    BatchSaveBinsDto:
      type: object
      properties:
        mode:
          type: string
          enum: [overwrite, merge]
          example: overwrite
          description: 'overwrite: replace all bins (blocked if any active stock exists); merge: upsert bins without modifying inventory'
        bins:
          type: array
          items:
            $ref: '#/components/schemas/BatchSaveBinItemDto'
      required:
        - mode
        - bins
    CreateTagDto:
      type: object
      properties:
        tagId:
          type: string
          minLength: 1
          maxLength: 64
          example: 686E14141E13194568471D7F
          description: Physical EPC/tag ID, globally unique.
        receivedAt:
          type: string
          example: '2026-08-01'
          description: When this physical unit/lot actually arrived - defaults to unset (not "now"); set explicitly for batch/historical stock entry.
      required:
        - tagId
    BindTagDto:
      type: object
      properties:
        productId:
          type: string
          format: uuid
          example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
        receivedAt:
          type: string
          example: '2026-08-01'
          description: When this physical unit/lot actually arrived - defaults to now only if never set (e.g. by preRegister), never overwrites an already-set value unless provided explicitly here.
      required:
        - productId
    CreateDeviceDto:
      type: object
      properties:
        readerId:
          type: string
          description: Must match the reader_id the physical device sends when ingesting.
          maxLength: 64
          example: R001
        label:
          type: string
          maxLength: 255
          example: Dock door 3 reader
        locationZone:
          type: string
          maxLength: 255
          example: Zone-A
        model:
          type: string
          maxLength: 100
          example: Impinj Speedway R420
        firmwareVersion:
          type: string
          maxLength: 50
          example: 5.13.2.240
      required:
        - readerId
    UpdateDeviceDto:
      type: object
      properties:
        label:
          type: string
          maxLength: 255
          example: Dock door 3 reader
        locationZone:
          type: string
          maxLength: 255
          example: Zone-A
        status:
          enum:
            - active
            - inactive
            - decommissioned
          type: string
          example: active
        binLocationId:
          type: string
          format: uuid
          description: Which bin this reader is physically stationed at - id from GET /warehouses/:id/bins.
    CreateWebhookSubscriptionDto:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/webhooks/matchstock
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - low_stock.triggered
              - tag.missing
              - goods_receipt.received
              - goods_issue.dispatched
              - stock_adjustment.closed
              - stock_transfer.completed
              - cycle_count.closed
              - '*'
          example:
            - goods_receipt.received
            - goods_issue.dispatched
          description: Event types to subscribe to, or ["*"] for every event.
      required:
        - url
        - eventTypes
    UpdateWebhookSubscriptionDto:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/webhooks/matchstock
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - low_stock.triggered
              - tag.missing
              - goods_receipt.received
              - goods_issue.dispatched
              - stock_adjustment.closed
              - stock_transfer.completed
              - cycle_count.closed
              - '*'
        status:
          enum:
            - active
            - disabled
          type: string
    CreateGoodsReceiptDto:
      type: object
      properties:
        receiptNumber:
          type: string
          maxLength: 100
          example: GR-2026-001
        warehouseId:
          type: string
          format: uuid
          example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
        binLocationId:
          type: string
          format: uuid
          description: Default putaway bin for this receipt.
        supplierId:
          type: string
          format: uuid
          example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
          description: Supplier this shipment came from. Omit for a customer return, free sample, or opening-stock count that has no supplier.
        poNumber:
          type: string
          maxLength: 100
          example: PO-2026-0088
          description: Purchase order number this receipt fulfills, if any.
        supplierInvoiceNo:
          type: string
          maxLength: 100
          example: INV-88213
          description: Supplier's delivery note / invoice number, if any.
        photoUrls:
          example:
            - /uploads/products/gr-88213-1.jpg
          description: Photos of the delivery note or box condition.
          type: array
          items:
            type: string
        receivedAt:
          type: string
          example: '2026-08-17T00:00:00.000Z'
        notes:
          type: string
          maxLength: 1000
        lines:
          maxItems: 500
          description: Quantity-based line items (barcode/manual-count path) - optional, independent of POST /goods-receipts/:id/lines (the RFID tag-binding path). A line with binLocationId set is placed immediately (1-Step); one without is created staged, awaiting POST /putaway/confirm (2-Step).
          type: array
          items:
            $ref: '#/components/schemas/CreateGoodsReceiptLineDto'
      required:
        - receiptNumber
        - warehouseId
    ReceiveGoodsDto:
      type: object
      properties:
        productId:
          type: string
          format: uuid
          example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
        tagIds:
          minItems: 1
          example:
            - 686E14141E13194568471D7F
          type: array
          items:
            type: string
        lotNumber:
          type: string
          maxLength: 100
          example: LOT-2026-08-A
        productionDate:
          type: string
          example: '2026-08-01T00:00:00.000Z'
        expiryDate:
          type: string
          example: '2027-08-01T00:00:00.000Z'
        unitCostMinor:
          type: number
          minimum: 0
          example: 10000
          description: Actual unit cost paid, minor units (satang) - captured per physical tag for FIFO/specific-identification valuation. Omit if unknown; the valuation report flags uncosted stock rather than treating it as free.
      required:
        - productId
        - tagIds
    CreateGoodsIssueDto:
      type: object
      properties:
        issueNumber:
          type: string
          maxLength: 100
          example: GI-2026-001
        warehouseId:
          type: string
          format: uuid
          example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
        binLocationId:
          type: string
          format: uuid
        soNumber:
          type: string
          maxLength: 100
          example: SO-2026-0042
          description: Optional Sales Order document number linked to this issue.
        salesOrderId:
          type: string
          format: uuid
          nullable: true
          example: 362fecaa-d3d7-4f42-b979-756fb8444d57
          description: Optional direct UUID reference to the Sales Order entity.
