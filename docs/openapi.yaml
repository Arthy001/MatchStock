          type: array
          items:
            type: string
        lines:
          maxItems: 500
          description: Quantity-based line items (barcode/manual-count path) - only quantity/productId/binLocationId/lotNumber are used here (unitPriceMinor is ignored for reserve/release).
          type: array
          items:
            $ref: '#/components/schemas/CreateGoodsIssueItemDto'
    DispatchByQuantityDto:
      type: object
      properties:
