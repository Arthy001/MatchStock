        quantity:
          type: number
          minimum: 1
          example: 5
        warehouseId:
          type: string
          format: uuid
          description: Restrict FIFO selection to tags currently in this warehouse.
      required:
        - productId
        - quantity
    CreateStockTransferDto:
      type: object
      properties:
        transferNumber:
          type: string
          maxLength: 100
          example: TR-2026-001
        fromWarehouseId:
          type: string
          format: uuid
          example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
        fromBinLocationId:
          type: string
          format: uuid
        toWarehouseId:
          type: string
          format: uuid
          example: c4f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6c
        toBinLocationId:
          type: string
          format: uuid
        tagIds:
          minItems: 1
          example:
            - 686E14141E13194568471D7F
          description: RFID tags to move (optional if `lines` is given instead - at least one of the two is required, checked at the service layer since class-validator can't express "either A or B" across two sibling arrays cleanly).
          type: array
          items:
            type: string
        notes:
          type: string
          maxLength: 1000
        lines:
          maxItems: 500
          description: Quantity-based line items (barcode/manual-count path) - declared "pending" alongside the header like tagIds are, StockBalance only moves once POST /stock-transfers/:id/complete confirms it (matching the existing Tag path's timing).
          type: array
          items:
            $ref: '#/components/schemas/CreateStockTransferItemDto'
      required:
        - transferNumber
        - fromWarehouseId
        - toWarehouseId
    StockAdjustmentLineDto:
      type: object
      properties:
        tagId:
          type: string
          example: 686E14141E13194568471D7F
