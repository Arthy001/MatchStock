      responses:
        '204':
          description: ''
      summary: Revoke a refresh token (does not invalidate already-issued access tokens, which expire on their own).
      tags:
        - Auth
  /auth/logout-all:
    post:
      operationId: AuthController_logoutAll_v1
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - jwt: []
      summary: Revoke every refresh token for the signed-in user (log out of all devices/sessions at once).
      tags:
        - Auth
