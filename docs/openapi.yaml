openapi: 3.0.3
info:
  title: MatchStock API Contract
  description: >
    MatchStock Multi-Tenant Warehouse Management & Inventory System API Specification.
    Designed for Front-End (React) and Back-End (Node.js + Prisma) integration.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: https://matchstock-api-staging-xxxx-as.a.run.app/api/v1
    description: Staging Environment (Cloud Run)

security:
  - BearerAuth: []

paths:
  # ========================================================
  # 1. AUTHENTICATION & PROFILE
  # ========================================================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates user and returns JWT Token containing userId, tenantId, and role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@matchstock.com
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/UserProfile'
                  tenant:
                    $ref: '#/components/schemas/TenantProfile'
                  subscription:
                    $ref: '#/components/schemas/SubscriptionDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get Current User Profile & Permissions
      description: Returns the authenticated user's profile, tenant, and active subscription feature flags.
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/UserProfile'
                  tenant:
                    $ref: '#/components/schemas/TenantProfile'
                  subscription:
                    $ref: '#/components/schemas/SubscriptionDetail'

  # ========================================================
  # 2. MASTER DATA: PRODUCTS
  # ========================================================
  /products:
    get:
      tags:
        - Products
      summary: List Products
      description: Retrieve paginated list of products for the current tenant.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          description: Search by code, sku, barcode, or name
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: brandId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Products
      summary: Create Product
      description: Create a new product SKU in the current tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductInput'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get Product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Products
      summary: Update Product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductInput'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'

  # ========================================================
  # 2.5 MASTER DATA: COMPANIES (1 TENANT : N COMPANIES)
  # ========================================================
  /companies:
    get:
      tags:
        - Companies
      summary: List Companies
      description: Retrieve all companies/subsidiaries belonging to the active tenant.
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
    post:
      tags:
        - Companies
      summary: Create Company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyInput'
      responses:
        '201':
          description: Company created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Company'

  /companies/{id}:
    get:
      tags:
        - Companies
      summary: Get Company Details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Company details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Company'
    put:
      tags:
        - Companies
      summary: Update Company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyInput'
      responses:
        '200':
          description: Company updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Company'
    delete:
      tags:
        - Companies
      summary: Delete Company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Company deleted successfully

  # ========================================================
  # 3. MASTER DATA: WAREHOUSES & BINS
  # ========================================================
  /warehouses:
    get:
      tags:
        - Warehouses
      summary: List Warehouses
      responses:
        '200':
          description: List of warehouses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warehouse'
    post:
      tags:
        - Warehouses
      summary: Create Warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
              properties:
                code:
                  type: string
                  example: WH-01
                name:
                  type: string
                  example: Bangkok Main Hub
      responses:
        '201':
          description: Warehouse created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Warehouse'

  /warehouses/{id}/bins:
    get:
      tags:
        - Warehouses
      summary: List Bins in Warehouse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of bin locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BinLocation'
    post:
      tags:
        - Warehouses
      summary: Create Bin Location in Warehouse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: A-01-01
      responses:
        '201':
          description: Bin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BinLocation'

  # ========================================================
  # 4. CORE STOCK OPERATIONS & BALANCES (Preview)
  # ========================================================
  /inventory/balances:
    get:
      tags:
        - Inventory
      summary: Real-Time Inventory Balances Lookup
      parameters:
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current stock balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryBalance'

  /inventory/transactions/receive:
    post:
      tags:
        - Inventory Transactions
      summary: Goods Receive (GR)
      description: Record incoming stock, create lots (if lot control), and increment inventory balances.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsReceiveInput'
      responses:
        '201':
          description: Stock received successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  documentNo:
                    type: string
                    example: GR-202608-001

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, manager, warehouse_staff, purchasing_staff, staff]

    TenantProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        status:
          type: string

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        code:
          type: string
          example: COMP-001
        name:
          type: string
          example: MatchStock Retail Co., Ltd.
        taxId:
          type: string
          example: '0105559012345'
        branchCode:
          type: string
          example: '00000'
        branchName:
          type: string
          example: Headquarters (สำนักงานใหญ่)
        phone:
          type: string
          example: '+66 2 555 0100'
        email:
          type: string
          example: contact@matchstock.com
        address:
          type: string
          example: 88/1 Sukhumvit Rd, Bangkok 10110
        isHeadquarter:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCompanyInput:
      type: object
      required:
        - name
      properties:
        code:
          type: string
          example: COMP-001
        name:
          type: string
          example: MatchStock Retail Co., Ltd.
        taxId:
          type: string
          example: '0105559012345'
        branchCode:
          type: string
          example: '00000'
        branchName:
          type: string
          example: Headquarters
        phone:
          type: string
          example: '+66 2 555 0100'
        email:
          type: string
          example: contact@matchstock.com
        address:
          type: string
          example: 88/1 Sukhumvit Rd, Bangkok
        isHeadquarter:
          type: boolean
          example: true

    UpdateCompanyInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        taxId:
          type: string
        branchCode:
          type: string
        branchName:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        isHeadquarter:
          type: boolean

    SubscriptionDetail:
      type: object
      properties:
        planCode:
          type: string
          example: PRO_YEARLY
        planName:
          type: string
          example: Pro Business Plan
        status:
          type: string
          example: active
        features:
          type: object
          properties:
            hasLotTracking:
              type: boolean
            hasBarcodeScanner:
              type: boolean
            hasCycleCount:
              type: boolean
            hasAnalyticsReports:
              type: boolean
            hasImportExport:
              type: boolean
            hasApiAccess:
              type: boolean

    Product:
      type: object
      description: >
        Field names/types here match the real backend response exactly
        (verified directly against the live API, 2026-08-26) - not aspirational.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: PRD-001
        sku:
          type: string
          example: LOGI-MX3S-GRY
        barcodeValue:
          type: string
          nullable: true
          example: '8851234567890'
        name:
          type: string
          example: Logitech MX Master 3S
        sellingPriceMinor:
          type: integer
          nullable: true
          description: Selling price in minor currency units (satang) - integer, never a float, to avoid rounding errors. Divide by 100 for THB.
          example: 389000
        weightValue:
          type: number
          nullable: true
          description: Weight in whatever unit weightUnit resolves to (per-tenant configurable, not fixed to kg).
          example: 0.141
        widthValue:
          type: number
          nullable: true
          description: Dimension in whatever unit dimensionUnit resolves to (per-tenant configurable, not fixed to cm).
          example: 8.43
        lengthValue:
          type: number
          nullable: true
          example: 12.49
        heightValue:
          type: number
          nullable: true
          example: 5.10
        reorderPoint:
          type: integer
          nullable: true
          example: 10
        minReorderQuantity:
          type: integer
          nullable: true
          example: 20
        lotControlled:
          type: boolean
          example: true
        unit:
          type: object
          nullable: true
          description: Resolved from unitId - null if unitId is unset.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: ชิ้น
            type:
              type: string
              example: quantity
        dimensionUnit:
          type: object
          nullable: true
          description: Resolved from dimensionUnitId - the unit widthValue/lengthValue/heightValue are measured in.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            type:
              type: string
        weightUnit:
          type: object
          nullable: true
          description: Resolved from weightUnitId - the unit weightValue is measured in.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            type:
              type: string

    CreateProductInput:
      type: object
      description: >
        Also used as the request body for PUT /products/{id} - the backend
        reuses the same schema for create and update. Field names match the
        real backend exactly (verified against the live API, 2026-08-26).
      required:
        - code
        - sku
        - name
      properties:
        code:
          type: string
          example: PRD-002
        sku:
          type: string
          example: KBD-MEC-RGB
        barcodeValue:
          type: string
          example: '8859990001112'
        barcodeSymbologyId:
          type: string
          format: uuid
        name:
          type: string
          example: Mechanical RGB Keyboard
        description:
          type: string
        unitId:
          type: string
          format: uuid
          description: References the Unit catalog entry used for stock-keeping quantity - resolved back as `unit` in the Product response.
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        manufacturerId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        costPriceMinor:
          type: integer
          example: 180000
        sellingPriceMinor:
          type: integer
          description: Selling price in minor currency units (satang) - integer, divide by 100 for THB.
          example: 249000
        currency:
          type: string
          example: THB
        weightValue:
          type: number
          example: 0.850
        widthValue:
          type: number
          example: 14.5
        lengthValue:
          type: number
          example: 44.0
        heightValue:
          type: number
          example: 3.8
        dimensionUnitId:
          type: string
          format: uuid
          description: Unit widthValue/lengthValue/heightValue are measured in.
        weightUnitId:
          type: string
          format: uuid
          description: Unit weightValue is measured in.
        reorderPoint:
          type: integer
          example: 5
        minReorderQuantity:
          type: integer
          example: 15
        lotControlled:
          type: boolean
          example: false
        taxTypeId:
          type: string
          format: uuid
        warrantyPeriodDays:
          type: integer
          example: 365

    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: WH-01
        name:
          type: string
          example: คลังสินค้าหลักกรุงเทพ

    BinLocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        code:
          type: string
          example: A-01-01

    InventoryBalance:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        binLocationId:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
        quantityOnHand:
          type: number
          example: 50.0
        quantityReserved:
          type: number
          example: 5.0

    GoodsReceiveInput:
      type: object
      required:
        - warehouseId
        - items
      properties:
        warehouseId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
                format: uuid
              binLocationId:
                type: string
                format: uuid
              quantity:
                type: number
                example: 100
              unitPrice:
                type: number
                example: 350.00
              lotNumber:
                type: string
                example: LOT-2026-08A
              manufacturedDate:
                type: string
                format: date
                example: '2026-08-01'
              expirationDate:
                type: string
                format: date
                example: '2028-08-01'

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalCount:
          type: integer
          example: 105
        totalPages:
          type: integer
          example: 6

  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Unauthorized access

    ForbiddenError:
      description: Feature not permitted in current subscription plan or user role
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Forbidden: Your subscription plan does not include this feature

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Resource not found

    ValidationError:
      description: Invalid request payload
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation failed
              errors:
                type: array
                items:
                  type: string
