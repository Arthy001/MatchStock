          enum:
            - in_stock
            - exited
          type: string
          example: exited
      required:
        - tagId
        - newStatus
    CreateStockAdjustmentDto:
      type: object
      properties:
        adjustmentNumber:
          type: string
          maxLength: 100
          example: ADJ-2026-001
        warehouseId:
          type: string
          format: uuid
        binLocationId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - damaged
            - lost
            - found
            - recount
            - other
          example: lost
        notes:
          type: string
          maxLength: 1000
        lines:
          minItems: 1
          description: RFID tag reconciliation (optional if `quantityLines` is given instead - at least one of the two is required, checked at the service layer).
          type: array
          items:
            $ref: '#/components/schemas/StockAdjustmentLineDto'
        quantityLines:
          maxItems: 500
          description: Quantity-based reconciliation (barcode/manual-count path) - applied to StockBalance immediately, same one-shot timing as `lines` above.
          type: array
          items:
            $ref: '#/components/schemas/CreateStockAdjustmentItemDto'
      required:
        - adjustmentNumber
        - reason
