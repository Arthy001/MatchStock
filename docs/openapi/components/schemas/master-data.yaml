CreateBinLocationDto:
  type: object
  properties:
    code:
      type: string
      maxLength: 50
      example: A1-03
    zoneName:
      type: string
      maxLength: 100
      example: Zone A
    rack:
      type: string
      maxLength: 50
      example: Rack A01
    shelf:
      type: string
      maxLength: 50
      example: Level A
    capacityKg:
      type: number
      example: 500
    maxCapacity:
      type: number
      minimum: 0
      example: 100
  required:
    - code
UpdateWarehouseDto:
  type: object
  properties:
    name:
      type: string
      maxLength: 255
      example: Bangkok Main Warehouse
    address:
      type: string
      maxLength: 500
      example: 123 Sukhumvit Rd, Bangkok
    isActive:
      type: boolean
      example: true
    isDeleted:
      type: boolean
      example: false
    maxCapacity:
      type: number
      minimum: 0
      example: 1000
      description: Total tag-count ceiling - GET /alerts flags this warehouse once the live count exceeds it.
    companyId:
      type: string
      nullable: true
      format: uuid
      description: Scope this warehouse to one Company (branch/subsidiary) - null = shared/tenant-wide warehouse.
UpdateBinLocationDto:
  type: object
  properties:
    code:
      type: string
      maxLength: 50
      example: A1-03
    zoneName:
      type: string
      maxLength: 100
      example: Zone A
    rack:
      type: string
      maxLength: 50
      example: Rack A01
    shelf:
      type: string
      maxLength: 50
      example: Level A
    capacityKg:
      type: number
      example: 500
    status:
      type: string
      example: available
    isActive:
      type: boolean
      example: true
    isDeleted:
      type: boolean
      example: false
    maxCapacity:
      type: number
      minimum: 0
      example: 100
      description: Total tag-count ceiling - GET /alerts flags this bin once the live count exceeds it.
BatchSaveBinItemDto:
  type: object
  properties:
    binCode:
      type: string
      example: ZoneA-A01-A-01
    zone:
      type: string
      example: Zone A
    rack:
      type: string
      example: Rack A01
    shelf:
      type: string
      example: Level A
    capacityKg:
      type: number
      example: 500
    maxCapacity:
      type: number
      example: 500
    status:
      type: string
      enum:
        - available
        - full
        - maintenance
      example: available
    isActive:
      type: boolean
      example: true
  required:
    - binCode
BatchSaveBinsDto:
  type: object
  properties:
    mode:
      type: string
      enum:
        - overwrite
        - merge
      example: overwrite
      description: 'overwrite: replace all bins (blocked if any active stock exists); merge: upsert bins without modifying inventory'
    bins:
      type: array
      items:
        $ref: ./master-data.yaml#/BatchSaveBinItemDto
  required:
    - mode
    - bins
BindTagDto:
  type: object
  properties:
    productId:
      type: string
      format: uuid
      example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
    receivedAt:
      type: string
      example: '2026-08-01'
      description: When this physical unit/lot actually arrived - defaults to now only if never set (e.g. by preRegister), never overwrites an already-set value unless provided explicitly here.
  required:
    - productId
CreateZoneDto:
  type: object
  properties:
    code:
      type: string
      maxLength: 50
      example: cold-storage
      description: Auto-derived from name if omitted.
    name:
      type: string
      maxLength: 255
      example: Cold Storage
  required:
    - name
UpdateZoneDto:
  type: object
  properties:
    name:
      type: string
      maxLength: 255
    isActive:
      type: boolean
    isDeleted:
      type: boolean
      example: false
