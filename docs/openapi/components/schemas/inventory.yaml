CreateGoodsReceiptDto:
  type: object
  properties:
    receiptNumber:
      type: string
      maxLength: 100
      example: GR-2026-001
    warehouseId:
      type: string
      format: uuid
      example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
    binLocationId:
      type: string
      format: uuid
      description: Default putaway bin for this receipt. Must belong to warehouseId if specified; otherwise returns 400 Bad Request.
    supplierId:
      type: string
      format: uuid
      example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
      description: Supplier this shipment came from. Omit for a customer return, free sample, or opening-stock count that has no supplier.
    poNumber:
      type: string
      maxLength: 100
      example: PO-2026-0088
      description: Purchase order number this receipt fulfills, if any.
    supplierInvoiceNo:
      type: string
      maxLength: 100
      example: INV-88213
      description: Supplier's delivery note / invoice number, if any.
    photoUrls:
      example:
        - /uploads/products/gr-88213-1.jpg
      description: Photos of the delivery note or box condition.
      type: array
      items:
        type: string
    receivedAt:
      type: string
      example: '2026-08-17T00:00:00.000Z'
    notes:
      type: string
      maxLength: 1000
    lines:
      maxItems: 500
      description: Quantity-based line items (barcode/manual-count path) - optional, independent of POST /goods-receipts/:id/lines (the RFID tag-binding path). A line with binLocationId set is placed immediately (1-Step); one without is created staged, awaiting POST /putaway/confirm (2-Step).
      type: array
      items:
        $ref: ./inventory.yaml#/CreateGoodsReceiptLineDto
  required:
    - receiptNumber
    - warehouseId
CreateGoodsIssueDto:
  type: object
  properties:
    issueNumber:
      type: string
      maxLength: 100
      example: GI-2026-001
    warehouseId:
      type: string
      format: uuid
      example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
    binLocationId:
      type: string
      format: uuid
    soNumber:
      type: string
      maxLength: 100
      example: SO-2026-0042
      description: Optional Sales Order document number linked to this issue.
    salesOrderId:
      type: string
      format: uuid
      nullable: true
      example: 362fecaa-d3d7-4f42-b979-756fb8444d57
      description: Optional direct UUID reference to the Sales Order entity.
    reference:
      type: string
      maxLength: 255
      example: SO-10023
    issuedAt:
      type: string
      example: '2026-08-17T00:00:00.000Z'
    notes:
      type: string
      maxLength: 1000
    lines:
      maxItems: 500
      description: Quantity-based line items (barcode/manual-count path) - deducts StockBalance at the given bin immediately, independent of POST /goods-issues/:id/dispatch (the RFID tag-exit path).
      type: array
      items:
        $ref: ./inventory.yaml#/CreateGoodsIssueItemDto
  required:
    - issueNumber
    - warehouseId
RecordPickItemDto:
  type: object
  properties:
    productBarcode:
      type: string
      example: '885123456789'
    binBarcode:
      type: string
      example: ZoneA-A01-A-01
    productId:
      type: string
      format: uuid
    binLocationId:
      type: string
      format: uuid
    pickedQuantity:
      type: integer
      example: 5
    tagIds:
      type: array
      items:
        type: string
      description: Optional RFID Tag EPC IDs when scanned with RFID Handheld
  required:
    - pickedQuantity
RecordPickDto:
  type: object
  properties:
    scannedItems:
      type: array
      items:
        $ref: ./inventory.yaml#/RecordPickItemDto
  required:
    - scannedItems
RecordPackDto:
  type: object
  properties:
    cartonBarcode:
      type: string
      example: BOX-2026-001
    boxCount:
      type: integer
      example: 1
    totalWeightKg:
      type: number
      example: 2.5
    shippingCarrier:
      type: string
      example: Flash Express
    packageTrackingNo:
      type: string
      example: TH0192837465
  required:
    - cartonBarcode
RecordStageLoadDto:
  type: object
  properties:
    stagingDockBarcode:
      type: string
      example: DOCK-BAY-04B
    palletBarcode:
      type: string
      example: PALLET-092
  required:
    - stagingDockBarcode
CreateStockTransferDto:
  type: object
  properties:
    transferNumber:
      type: string
      maxLength: 100
      example: TR-2026-001
    fromWarehouseId:
      type: string
      format: uuid
      example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
    fromBinLocationId:
      type: string
      format: uuid
    toWarehouseId:
      type: string
      format: uuid
      example: c4f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6c
    toBinLocationId:
      type: string
      format: uuid
    tagIds:
      minItems: 1
      example:
        - 686E14141E13194568471D7F
      description: RFID tags to move (optional if `lines` is given instead - at least one of the two is required, checked at the service layer since class-validator can't express "either A or B" across two sibling arrays cleanly).
      type: array
      items:
        type: string
    notes:
      type: string
      maxLength: 1000
    lines:
      maxItems: 500
      description: Quantity-based line items (barcode/manual-count path) - declared "pending" alongside the header like tagIds are, StockBalance only moves once POST /stock-transfers/:id/complete confirms it (matching the existing Tag path's timing).
      type: array
      items:
        $ref: ./inventory.yaml#/CreateStockTransferItemDto
  required:
    - transferNumber
    - fromWarehouseId
    - toWarehouseId
StockAdjustmentLineDto:
  type: object
  properties:
    tagId:
      type: string
      example: 686E14141E13194568471D7F
    newStatus:
      enum:
        - in_stock
        - exited
      type: string
      example: exited
  required:
    - tagId
    - newStatus
CreateStockAdjustmentDto:
  type: object
  properties:
    adjustmentNumber:
      type: string
      maxLength: 100
      example: ADJ-2026-001
    warehouseId:
      type: string
      format: uuid
    binLocationId:
      type: string
      format: uuid
    reason:
      type: string
      enum:
        - damaged
        - lost
        - found
        - recount
        - other
      example: lost
    notes:
      type: string
      maxLength: 1000
    lines:
      minItems: 1
      description: RFID tag reconciliation (optional if `quantityLines` is given instead - at least one of the two is required, checked at the service layer).
      type: array
      items:
        $ref: ./inventory.yaml#/StockAdjustmentLineDto
    quantityLines:
      maxItems: 500
      description: Quantity-based reconciliation (barcode/manual-count path) - applied to StockBalance immediately, same one-shot timing as `lines` above.
      type: array
      items:
        $ref: ./inventory.yaml#/CreateStockAdjustmentItemDto
  required:
    - adjustmentNumber
    - reason
CreateCycleCountDto:
  type: object
  properties:
    countNumber:
      type: string
      maxLength: 100
      example: CC-2026-001
    warehouseId:
      type: string
      format: uuid
      example: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
    binLocationId:
      type: string
      format: uuid
      description: Scope the count to one bin - omit to count the whole warehouse.
    notes:
      type: string
      maxLength: 1000
  required:
    - countNumber
    - warehouseId
SubmitCycleCountDto:
  type: object
  properties:
    countedTagIds:
      example:
        - 686E14141E13194568471D7F
      type: array
      items:
        type: string
  required:
    - countedTagIds
CreateGoodsReceiptItemDto:
  type: object
  properties:
    productId:
      type: string
      format: uuid
      example: fed2e82f-7ee9-465f-bd43-ac982a9675a7
    quantity:
      type: integer
      minimum: 1
      example: 50
    damagedQuantity:
      type: integer
      minimum: 0
      default: 0
      example: 0
    lotNumber:
      type: string
      nullable: true
      example: LOT-2026-08A
    productionDate:
      type: string
      nullable: true
      example: '2026-08-01T00:00:00.000Z'
    expiryDate:
      type: string
      nullable: true
      example: '2028-08-01T00:00:00.000Z'
    unitCostMinor:
      type: integer
      nullable: true
      description: Cost price in minor units (satangs)
      example: 120000
    binLocationId:
      type: string
      format: uuid
      nullable: true
      description: Target bin for direct receiving. If null, remains in staging.
  required:
    - productId
    - quantity
CreateGoodsReceiptLineDto:
  type: object
  properties:
    productId:
      type: string
      format: uuid
      example: fed2e82f-7ee9-465f-bd43-ac982a9675a7
    quantity:
      type: number
      minimum: 1
      example: 95
      description: 'Good (sellable) quantity received - already net of damagedQuantity, matching the design doc worked example (100 received, 5 damaged -> quantity: 95).'
    damagedQuantity:
      type: number
      minimum: 0
      example: 0
      default: 0
      description: Units found damaged during inspection - tracked for supplier claims, never enters stock/putaway.
    lotNumber:
      type: string
      maxLength: 100
      example: LOT-2026-08-A
    productionDate:
      type: string
      example: '2026-08-01T00:00:00.000Z'
    expiryDate:
      type: string
      example: '2027-08-01T00:00:00.000Z'
    unitCostMinor:
      type: number
      minimum: 0
      example: 10000
      description: Actual unit cost paid, minor units (satang).
    binLocationId:
      type: string
      format: uuid
      example: a1111111-2222-4333-8444-555566667777
      description: '1-Step Direct Putaway - the shelf this line is placed on immediately. Must belong to the goods receipt warehouseId (returns 400 Bad Request if mismatched). Omit for 2-Step: the line is created staged (putawayQuantity: 0) and waits in GET /goods-receipts/staged-items for POST /putaway/confirm.'
  required:
    - productId
    - quantity
StockBalanceDto:
  type: object
  properties:
    id:
      type: string
      format: uuid
    warehouseId:
      type: string
      format: uuid
    warehouseName:
      type: string
    binLocationId:
      type: string
      format: uuid
      nullable: true
    binCode:
      type: string
      nullable: true
      example: A-01-01
    productId:
      type: string
      format: uuid
    productName:
      type: string
    sku:
      type: string
      example: LOGI-MX3S-GRY
    lotNumber:
      type: string
      nullable: true
      example: LOT-2026-08A
    expiryDate:
      type: string
      nullable: true
      example: '2028-08-31T00:00:00.000Z'
    quantityOnHand:
      type: integer
      example: 1000
    quantityReserved:
      type: integer
      example: 50
    availableQuantity:
      type: integer
      example: 950
StockLookupResponseDto:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        sku:
          type: string
          example: LOGI-MX3S-GRY
        name:
          type: string
          example: Logitech MX Master 3S
        barcodeValue:
          type: string
          example: 8851234567890
        totalOnHand:
          type: integer
          example: 1000
        totalAvailable:
          type: integer
          example: 950
        totalReserved:
          type: integer
          example: 50
        locations:
          type: array
          items:
            type: object
            properties:
              warehouseId:
                type: string
                format: uuid
              warehouseName:
                type: string
              binLocationId:
                type: string
                format: uuid
                nullable: true
              binCode:
                type: string
                nullable: true
                example: A-01-01
              lotNumber:
                type: string
                nullable: true
              expiryDate:
                type: string
                nullable: true
              quantity:
                type: integer
                example: 600
CreateGoodsIssueItemDto:
  type: object
  properties:
    productId:
      type: string
      format: uuid
      example: fed2e82f-7ee9-465f-bd43-ac982a9675a7
    quantity:
      type: number
      minimum: 1
      example: 20
    binLocationId:
      type: string
      format: uuid
      example: a1111111-2222-4333-8444-555566667777
      description: The shelf being picked from - required in practice (deducting StockBalance needs an exact location) even though the draft schema marked this nullable; no "reserve against no particular bin" semantics exist yet.
    lotNumber:
      type: string
      maxLength: 100
      example: LOT-2026-08-A
    unitPriceMinor:
      type: number
      minimum: 0
      example: 15000
      description: Selling price at time of dispatch, minor units (satang) - informational, not used for any calculation here.
  required:
    - productId
    - quantity
    - binLocationId
CreateStockTransferItemDto:
  type: object
  properties:
    productId:
      type: string
      format: uuid
      example: fed2e82f-7ee9-465f-bd43-ac982a9675a7
    quantity:
      type: number
      minimum: 1
      example: 100
    fromBinLocationId:
      type: string
      format: uuid
      description: Defaults to the transfer header's fromBinLocationId if omitted.
    toBinLocationId:
      type: string
      format: uuid
      description: Defaults to the transfer header's toBinLocationId if omitted.
    lotNumber:
      type: string
      maxLength: 100
      example: LOT-2026-08-A
  required:
    - productId
    - quantity
CreateStockAdjustmentItemDto:
  type: object
  properties:
    productId:
      type: string
      format: uuid
      example: fed2e82f-7ee9-465f-bd43-ac982a9675a7
    binLocationId:
      type: string
      format: uuid
    lotNumber:
      type: string
      maxLength: 100
      example: LOT-2026-08-A
    adjustedQuantity:
      type: number
      example: -5
      description: Positive for surplus found, negative for shortage - never zero.
  required:
    - productId
    - adjustedQuantity
ConfirmPutawayDto:
  type: object
  properties:
    goodsReceiptLineId:
      type: string
      format: uuid
      example: a1b2c3d4-e5f6-4a5b-8c7d-1e2f3a4b5c6d
      description: The staged GoodsReceiptLine being put away (see GET /goods-receipts/staged-items).
    binLocationId:
      type: string
      format: uuid
      example: a1111111-2222-4333-8444-555566667777
      description: The bin actually scanned on the floor - can differ from what GET /putaway/suggest-bin recommended (soft suggestion, never blocks). Must belong to the same warehouse as the goods receipt line (returns 400 Bad Request if mismatched).
    quantity:
      type: number
      minimum: 1
      example: 60
      description: How many units are being placed in this bin right now - can be less than the line's remaining quantity (partial/multi-bin putaway); confirm again with the same goodsReceiptLineId for the rest.
  required:
    - goodsReceiptLineId
    - binLocationId
    - quantity
