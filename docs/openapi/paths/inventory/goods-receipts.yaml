      '400':
        description: Bad request - e.g. bin location does not belong to the selected warehouse
        content:
          application/json:
            schema:
              example:
                statusCode: 400
                message: ตำแหน่งชั้นวางที่เลือกไม่ได้อยู่ในคลังสินค้านี้
                error: Bad Request
    security:
      - jwt: []
    summary: Open a goods receipt header for an incoming shipment.
    tags:
      - Goods Receipts
