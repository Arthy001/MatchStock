goods_receipts_staged_items:
  get:
    operationId: GoodsReceiptsController_listStagedItems_v1
    parameters:
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          example: 1
          type: number
      - name: limit
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 100
          default: 20
          example: 20
          type: number
      - name: warehouseId
        required: false
        in: query
        schema:
          format: uuid
          example: 362fecaa-d3d7-4f42-b979-756fb8444d57
          type: string
    responses:
      '200':
        description: ''
        content:
          application/json:
            schema:
              example:
                success: true
                data:
                  - goodsReceiptLineId: a2c3d4e5-6f70-4a8b-9c1d-2e3f4a5b6c7d
                    goodsReceiptId: b3f1a2c4-5d6e-4f70-8a9b-1c2d3e4f5a6b
                    receiptNumber: GR-202608-001
                    productId: fed2e82f-7ee9-465f-bd43-ac982a9675a7
