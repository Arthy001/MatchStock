rentals__id__deposit_checkout:
  post:
    operationId: RentalsController_payDeposit_v1
    parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.yaml#/CollectDepositDto
    responses:
      '201':
        description: ''
    security:
      - jwt: []
    summary: Pay this assignment's deposit (customer-initiated, like POST /billing/checkout). Returns authorizeUri if 3DS/PromptPay confirmation is needed.
