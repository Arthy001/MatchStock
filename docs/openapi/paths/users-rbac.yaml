users__id:
  patch:
    operationId: UsersController_update_v1
    parameters:
      - name: id
        required: true
        in: path
        schema:
          example: 9c6b1a2d-3e4f-4a5b-8c7d-1e2f3a4b5c6d
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/UpdateUserDto
    responses:
      '200':
        description: ''
        content:
          application/json:
            schema:
              type: object
    security:
      - jwt: []
    summary: Update a user's role or active status (owner/admin only).
    tags:
      - Users
  delete:
    operationId: UsersController_remove_v1
    parameters:
      - name: id
        required: true
        in: path
        schema:
          example: 9c6b1a2d-3e4f-4a5b-8c7d-1e2f3a4b5c6d
          type: string
    responses:
      '204':
        description: ''
    security:
      - jwt: []
    summary: 'Permanently remove a user (owner/admin only) - distinct from deactivate: this hides the row from every normal lookup, including this API, with no undo. Deactivate is the routine, reversible action; use this only to actually remove a mistaken/unwanted account.'
    tags:
      - Users
users__id__deactivate:
