name: Backend CI & Cloud Run Deploy

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cloudrun.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'

env:
  PROJECT_ID: matchstock-gcp-project
  GAR_LOCATION: asia-southeast1
  SERVICE: matchstock-api
  REGION: asia-southeast1

jobs:
  build_and_check:
    name: ⚙️ Build & Type Check (Node.js & Prisma)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client & Type Check
        working-directory: backend
        run: |
          npx prisma generate
          npm run build

      - name: Run Prisma Migration Deploy (If DB URL is set)
        if: env.HAS_DB_URL != ''
        env:
          HAS_DB_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Google Cloud Auth & Deploy (If GCP Key is set)
        if: env.HAS_GCP_KEY != ''
        env:
          HAS_GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run (If GCP Key is set)
        if: env.HAS_GCP_KEY != ''
        env:
          HAS_GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}:${{ github.sha }}
